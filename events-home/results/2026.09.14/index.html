<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>埼玉県市町村対抗選手権決勝 結果｜狭山市ゴルフ協会</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ======================
   全体
====================== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f7f5;
    color:#333;
    line-height:1.6;
}


/* ======================
   ヘッダー
====================== */
header{
    position:relative;
    width:100%;
    min-height:320px;

    background:url("../../header.jpg") center 35% / cover no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#fff;
    text-align:center;

    font-size:4rem;
    font-weight:bold;

    overflow:hidden;
}


/* オーバーレイ */
header::before{
    content:"";
    position:absolute;
    inset:0;

    background:rgba(0,0,0,0.45);

    z-index:1;
}


/* タイトル文字 */
header span{
    position:relative;
    z-index:2;

    text-shadow:
        0 4px 12px rgba(0,0,0,0.9);
}


/* ======================
   ナビタブ
====================== */
.nav-tabs{
    display:flex;
    justify-content:center;

    background:#ffffff;

    border-bottom:2px solid #c8e6c9;
}

.nav-tabs a{
    flex:1;

    text-align:center;

    padding:28px 5px;

    text-decoration:none;

    color:#2e7d32;

    font-weight:bold;
    font-size:1.2rem;

    border-right:1px solid #e0e0e0;

    transition:0.2s;
}

.nav-tabs a:last-child{
    border-right:none;
}

.nav-tabs a:hover{
    background:#e8f5e9;
}


/* ======================
   メイン
====================== */
main{
    max-width:1000px;

    margin:40px auto;

    padding:0 20px;
}


/* ======================
   ページタイトル
====================== */
.page-title{
    text-align:center;

    color:#2e7d32;

    font-size:2rem;

    font-weight:bold;

    margin-bottom:30px;
}


/* ======================
   結果ページ
====================== */
.result-box{
    background:#ffffff;

    border:2px solid #c8e6c9;

    border-radius:10px;

    padding:25px;

    margin-bottom:30px;

    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}


/* ======================
   大会概要
====================== */
.result-box h2{
    color:#2e7d32;

    font-size:1.3rem;

    margin-bottom:15px;

    padding-bottom:8px;

    border-bottom:1px solid #c8e6c9;
}

.result-info{
    font-size:1rem;
}

.result-info p{
    margin-bottom:8px;
}


/* ======================
   PDF表示
====================== */
.pdf-title{
    color:#2e7d32;

    font-size:1.3rem;

    font-weight:bold;

    margin-bottom:15px;
}


/* PDF表示エリア */
.pdf-container{
    width:100%;

    background:#eeeeee;

    border:1px solid #cccccc;

    border-radius:5px;

    overflow:hidden;
}


/* PDF */
.pdf-container iframe{
    display:block;

    width:100%;

    height:1000px;

    border:none;
}


/* PDFが開けない場合 */
.pdf-link{
    text-align:center;

    padding:15px;

    font-size:0.95rem;
}

.pdf-link a{
    color:#0066cc;

    text-decoration:none;

    font-weight:bold;
}

.pdf-link a:hover{
    text-decoration:underline;
}


/* ======================
   戻るボタン
====================== */
.back-button{
    text-align:center;

    margin-top:30px;
}

.back-button a{
    display:inline-block;

    padding:12px 30px;

    background:#2e7d32;

    color:#ffffff;

    text-decoration:none;

    border-radius:5px;

    font-weight:bold;

    transition:0.2s;
}

.back-button a:hover{
    background:#1b5e20;
}


/* ======================
   スマホ対応
====================== */
@media (max-width:768px){

    header{
        min-height:200px;

        font-size:2rem;

        background-position:center center;
    }

    .nav-tabs a{
        padding:16px 3px;

        font-size:0.9rem;
    }

    main{
        margin:25px auto;

        padding:0 14px;
    }

    .page-title{
        font-size:1.5rem;

        margin-bottom:20px;
    }

    .result-box{
        padding:15px;

        margin-bottom:20px;
    }

    .pdf-container iframe{
        height:700px;
    }

}

</style>
</head>


<body>


<!-- ======================
     ヘッダー
====================== -->
<header>
    <span>狭山市ゴルフ協会</span>
</header>


<!-- ======================
     ナビ
====================== -->
<div class="nav-tabs">

    <a href="/sayamashi-golf-kyokai/">
        ホーム
    </a>

    <a href="/sayamashi-golf-kyokai/events-home/index.html">
        大会案内
    </a>

    <a href="/sayamashi-golf-kyokai/list/yakuin-meibo/index.html">
        役員名簿
    </a>

    <a href="/sayamashi-golf-kyokai/list/toiawase/index.html">
        問合せ
    </a>

</div>


<!-- ======================
     メイン
====================== -->
<main>


    <!-- ページタイトル -->
    <div class="page-title">
        埼玉県市町村対抗選手権決勝　結果
    </div>


    <!-- 大会概要 -->
    <div class="result-box">

        <h2>
            大会結果
        </h2>

        <div class="result-info">

            <p>
                <strong>大会名：</strong>
                埼玉県市町村対抗選手権決勝
            </p>

            <p>
                <strong>開催日：</strong>
                2026年9月14日
            </p>

            <p>
                <strong>結果：</strong>
                下記PDFをご覧ください。
            </p>

        </div>

    </div>


    <!-- PDF -->
    <div class="result-box">

        <div class="pdf-title">
            <i class="fa-solid fa-file-pdf"></i>
            大会結果
        </div>


        <div class="pdf-container">

            <iframe
                src="result.pdf"
                title="埼玉県市町村対抗選手権決勝 結果">
            </iframe>

        </div>


        <div class="pdf-link">

            PDFが表示されない場合は、
            <a href="result.pdf" target="_blank">
                こちらから結果PDFを開く
            </a>
            ことができます。

        </div>

    </div>


    <!-- 戻る -->
    <div class="back-button">

        <a href="/sayamashi-golf-kyokai/">
            <i class="fa-solid fa-house"></i>
            トップページへ戻る
        </a>

    </div>


</main>


</body>
</html>
