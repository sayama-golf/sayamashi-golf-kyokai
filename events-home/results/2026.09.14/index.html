<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>埼玉県市町村対抗選手権決勝 結果｜狭山市ゴルフ協会</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ======================
   全体
====================== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f7f5;
    color:#333;
    line-height:1.6;
}


/* ======================
   ヘッダー（統一）
====================== */
header{
    position:relative;
    width:100%;
    min-height:320px;

    background:url("../../../header.jpg") center 35% / cover no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#fff;
    text-align:center;

    font-size:4rem;
    font-weight:bold;

    overflow:hidden;
}

/* オーバーレイ */
header::before{
    content:"";
    position:absolute;
    inset:0;

    background:rgba(0,0,0,0.45);

    z-index:1;
}

/* タイトル文字 */
header span{
    position:relative;
    z-index:2;

    text-shadow:
        0 4px 12px rgba(0,0,0,0.9);
}


/* ======================
   ナビタブ（統一）
====================== */
.nav-tabs{
    display:flex;
    justify-content:center;

    background:#ffffff;

    border-bottom:2px solid #c8e6c9;
}

.nav-tabs a{
    flex:1;

    text-align:center;

    padding:28px 5px;

    text-decoration:none;

    color:#2e7d32;

    font-weight:bold;
    font-size:1.2rem;

    border-right:1px solid #e0e0e0;

    transition:0.2s;
}

.nav-tabs a:last-child{
    border-right:none;
}

.nav-tabs a:hover{
    background:#e8f5e9;
}


/* ======================
   メイン
====================== */
main{
    max-width:900px;

    margin:40px auto;

    padding:0 20px;
}


/* ======================
   ページタイトル
====================== */
.page-title{
    text-align:center;

    color:#2e7d32;

    font-size:2rem;

    font-weight:bold;

    margin-bottom:30px;
}


/* ======================
   結果ページ
====================== */
.result-box{
    background:#ffffff;

    border:2px solid #c8e6c9;

    border-radius:10px;

    padding:30px 25px;

    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}


/* ======================
   会長メッセージ
====================== */
.result-message{
    text-align:center;

    margin-bottom:30px;

    font-size:1.1rem;

    line-height:2;
}

.result-message .greeting{
    font-weight:bold;

    margin-bottom:5px;
}

.result-message .president{
    text-align:right;

    margin-top:5px;

    font-weight:bold;
}


/* ======================
   結果画像
====================== */
.result-image{
    text-align:center;

    margin-bottom:25px;
}

.result-image img{
    display:block;

    width:100%;
    max-width:800px;

    height:auto;

    margin:0 auto;

    border:1px solid #ddd;
}


/* ======================
   注意書き
====================== */
.result-note{
    margin-top:20px;

    font-size:0.9rem;

    color:#666;

    text-align:center;
}


/* ======================
   スマホ対応
====================== */
@media (max-width:768px){

    header{
        min-height:200px;

        font-size:2rem;

        background-position:center center;
    }

    .nav-tabs a{
        padding:16px 3px;

        font-size:0.9rem;
    }

    main{
        margin:25px auto;

        padding:0 14px;
    }

    .page-title{
        font-size:1.5rem;

        margin-bottom:20px;
    }

    .result-box{
        padding:20px 15px;
    }

    .result-message{
        font-size:1rem;

        line-height:1.8;

        margin-bottom:20px;
    }

    .result-message .president{
        margin-top:5px;
    }

    .result-note{
        font-size:0.8rem;

        text-align:left;
    }

}

</style>
</head>


<body>


<!-- ======================
     ヘッダー
====================== -->
<header>
    <span>狭山市ゴルフ協会</span>
</header>


<!-- ======================
     ナビゲーション
====================== -->
<div class="nav-tabs">

    <a href="/sayamashi-golf-kyokai/">
        ホーム
    </a>

    <a href="/sayamashi-golf-kyokai/events-home/index.html">
        大会案内
    </a>

    <a href="/sayamashi-golf-kyokai/list/yakuin-meibo/index.html">
        役員名簿
    </a>

    <a href="/sayamashi-golf-kyokai/list/toiawase/index.html">
        問合せ
    </a>

</div>


<!-- ======================
     メイン
====================== -->
<main>


    <!-- ページタイトル -->
    <h1 class="page-title">
        埼玉県市町村対抗選手権決勝　結果
    </h1>


    <div class="result-box">


        <!-- ======================
             会長メッセージ
        ====================== -->
        <div class="result-message">

            <div class="greeting">
                選手の皆様、お疲れさまでした。
            </div>

            <div class="president">
                会長　尾池重孝
            </div>

        </div>


        <!-- ======================
             大会結果画像
        ====================== -->
        <div class="result-image">

            <img
                src="result.jpg"
                alt="埼玉県市町村対抗選手権決勝 大会結果">

        </div>


        <!-- ======================
             注意書き
        ====================== -->
        <div class="result-note">
            ※大会結果は埼玉県ゴルフ協会HPより引用しております。
        </div>


    </div>


</main>


</body>
</html>
